<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GXO — Driver Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Accent — orange GXO, utilisé avec parcimonie */
  --orange:        #FF5A1F;
  --orange-dark:   #D6430A;
  --orange-deep:   #B23A0C;
  --orange-tint:   rgba(255,90,31,0.08);
  --orange-tint-2: rgba(255,90,31,0.14);
  --orange-ring:   rgba(255,90,31,0.16);

  /* Neutres — interface claire premium */
  --paper:         #FAFAF8;
  --surface:       #FFFFFF;
  --surface-alt:   #F1F2F4;
  --border:        #E6E7EB;
  --border-strong: #D7D9DE;

  /* Texte */
  --ink:           #1C1F23;
  --ink-soft:      #565B63;
  --ink-faint:     #90949B;

  /* Statut */
  --green:         #158A43;
  --green-tint:    rgba(21,138,67,0.10);
  --green-ring:    rgba(21,138,67,0.28);

  --radius-sm: 8px;
  --radius:    12px;
  --radius-lg: 18px;

  --shadow-xs: 0 1px 2px rgba(20,21,26,0.04);
  --shadow-sm: 0 2px 8px rgba(20,21,26,0.06);
  --shadow-md: 0 10px 28px rgba(20,21,26,0.10);
  --shadow-lg: 0 24px 60px rgba(20,21,26,0.14);

  --transition: cubic-bezier(0.4,0,0.2,1);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  visibility: hidden; opacity: 0; pointer-events: none;
  transition: opacity 0.5s var(--transition), visibility 0.5s;
  overflow-y: auto; overflow-x: hidden;
}
.screen.active { visibility: visible; opacity: 1; pointer-events: all; }

/* SCREEN 0 — LANGUAGE */
#s-lang { background: var(--paper); align-items: center; justify-content: center; overflow: hidden; }
.grid-bg {
  position: absolute; inset: -50%;
  background-image: linear-gradient(rgba(28,31,35,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(28,31,35,0.035) 1px, transparent 1px);
  background-size: 60px 60px; animation: gridShift 24s linear infinite;
}
@keyframes gridShift { to { transform: translate(60px, 60px); } }
.radial-glow {
  position: absolute; width: 640px; height: 640px;
  background: radial-gradient(circle, rgba(255,90,31,0.10) 0%, transparent 65%);
  border-radius: 50%; top: 45%; left: 50%; transform: translate(-50%,-50%);
  animation: pulse 5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { transform: translate(-50%,-50%) scale(1); opacity:1; }
  50% { transform: translate(-50%,-50%) scale(1.08); opacity:0.75; }
}
.lang-inner { position: relative; z-index: 2; text-align: center; padding: 2rem; animation: fadeUp 0.9s var(--transition) both; }
.gxo-wordmark { display: inline-flex; align-items: baseline; gap: 0; margin-bottom: 0.6rem; }
.gxo-wordmark .g, .gxo-wordmark .x, .gxo-wordmark .o {
  font-family: 'Bebas Neue', sans-serif; font-size: clamp(5rem, 20vw, 8rem); line-height: 1; letter-spacing: -4px;
}
.gxo-wordmark .g { color: var(--ink); }
.gxo-wordmark .x { color: var(--orange); }
.gxo-wordmark .o { color: var(--ink); }
.tagline { font-size: 0.65rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3.5rem; font-weight: 600; }
.lang-prompt { font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 1.5rem; font-weight: 600; }
.lang-grid { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; max-width: 460px; }
.lang-card {
  position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.5rem 1.75rem; cursor: pointer; transition: all 0.3s var(--transition); min-width: 96px; overflow: hidden;
  box-shadow: var(--shadow-xs);
}
.lang-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--orange), var(--orange-dark));
  opacity: 0; transform: scaleX(0.35); transform-origin: center; transition: all 0.35s var(--transition);
}
.lang-card:hover { border-color: var(--orange); transform: translateY(-4px); box-shadow: var(--shadow-md); }
.lang-card:hover::after { opacity: 1; transform: scaleX(1); }
.lang-card:active { transform: translateY(-2px); }
.lang-flag { position: relative; z-index: 1; font-size: 2.2rem; display: block; margin-bottom: 0.5rem; }
.lang-label { position: relative; z-index: 1; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); }
.admin-access {
  position: absolute; bottom: 18px; right: 18px; z-index: 3; background: var(--surface); border: 1px solid var(--border);
  color: var(--ink-faint); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; transition: all 0.2s; box-shadow: var(--shadow-xs);
}
.admin-access:hover { border-color: var(--orange); color: var(--orange-dark); }

/* SCREEN 1 — SLIDES */
#s-slides { background: var(--paper); flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border); flex-shrink: 0; background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100;
}
.topbar-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: -1px; line-height: 1; color: var(--ink); }
.topbar-logo .x { color: var(--orange); }
.topbar-info { text-align: right; }
.topbar-site { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); line-height: 1.6; font-weight: 600; }
.progress-track { height: 3px; background: var(--border); flex-shrink: 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--orange-dark)); transition: width 0.6s var(--transition); }
.slides-area { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.slide {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2rem 1.5rem; text-align: center; opacity: 0; transform: translateX(80px) scale(0.98);
  transition: opacity 0.55s var(--transition), transform 0.55s var(--transition); pointer-events: none; overflow-y: auto;
}
.slide.active { opacity: 1; transform: none; pointer-events: all; }
.slide.exit { opacity: 0; transform: translateX(-80px) scale(0.98); }
.slide-badge {
  display: inline-flex; align-items: center; gap: 0.5rem; background: var(--orange-tint);
  border: 1px solid var(--orange-tint-2); border-radius: 20px; padding: 0.3rem 0.9rem; font-size: 0.65rem;
  font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--orange-deep); margin-bottom: 1.5rem; flex-shrink:0;
}
.icon-ring {
  width: 78px; height: 78px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin-bottom: 1.5rem; position: relative; flex-shrink:0;
  box-shadow: var(--shadow-xs);
}
.icon-ring::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(255,90,31,0.18); }
.icon-ring::after { content: ''; position: absolute; inset: -12px; border-radius: 50%; border: 1px solid rgba(255,90,31,0.08); }
.slide-heading {
  font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 0.95;
  letter-spacing: -0.02em; margin-bottom: 1.1rem; text-transform: uppercase; flex-shrink:0; color: var(--ink);
}
.slide-heading em { color: var(--orange); font-style: normal; }
.slide-body { font-size: clamp(0.9rem, 2.5vw, 1.05rem); line-height: 1.75; color: var(--ink-soft); max-width: 480px; font-weight: 400; }

.safety-wrap { display: grid; grid-template-columns: 1fr; gap: 0.55rem; width: 100%; max-width: 480px; }
.s-item {
  display: flex; align-items: center; gap: 0.75rem; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0.7rem 0.9rem; text-align: left; transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow-xs);
}
.s-item:hover { border-color: rgba(255,90,31,0.35); box-shadow: var(--shadow-sm); }
.s-icon { font-size: 1.2rem; flex-shrink: 0; width: 1.4rem; text-align: center; }
.s-text { font-size: 0.76rem; color: var(--ink-soft); font-weight: 500; line-height: 1.4; }
.safety-note {
  margin-top: 1.1rem; max-width: 480px; width: 100%; text-align: left; background: var(--orange-tint);
  border-left: 3px solid var(--orange); border-radius: 0 8px 8px 0; padding: 0.85rem 1rem;
  font-size: 0.74rem; color: var(--ink); font-weight: 600; letter-spacing: 0.01em; line-height: 1.5;
}

.emergency-wrap { display: flex; flex-direction: column; gap: 0.6rem; width: 100%; max-width: 480px; }
.em-cat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.9rem 1rem; text-align: left; box-shadow: var(--shadow-xs); }
.em-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }
.em-icon { font-size: 1.15rem; }
.em-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em; color: var(--ink); text-transform: uppercase; }
.em-steps { list-style: none; padding-left: 1.9rem; display: flex; flex-direction: column; gap: 0.25rem; }
.em-steps li { font-size: 0.75rem; color: var(--ink-soft); line-height: 1.5; position: relative; }
.em-steps li::before { content: '—'; position: absolute; left: -1.1rem; color: var(--orange-dark); }
.em-numbers { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.3rem; flex-wrap: wrap; }
.em-num {
  display: flex; flex-direction: column; align-items: center; gap: 0.15rem; background: var(--orange-tint);
  border: 1px solid var(--orange-tint-2); border-radius: var(--radius-sm); padding: 0.55rem 1rem; min-width: 82px;
}
.em-num-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--orange-deep); line-height: 1; }
.em-num-label { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }

.slides-nav {
  display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.5rem;
  border-top: 1px solid var(--border); flex-shrink: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
}
.dots { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 120px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); transition: all 0.35s var(--transition); }
.dot.on { background: var(--orange); width: 16px; border-radius: 3px; }
.btn-next {
  display: flex; align-items: center; gap: 0.6rem; background: var(--surface); border: 1px solid var(--border);
  color: var(--ink); padding: 0.75rem 1.35rem; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif;
  font-weight: 600; font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: all 0.25s var(--transition);
  box-shadow: var(--shadow-xs);
}
.btn-next:hover { background: var(--surface-alt); border-color: var(--border-strong); transform: translateX(2px); }
.btn-next.cta { background: var(--orange); border-color: var(--orange); color: #FFFFFF; padding: 0.85rem 1.8rem; font-size: 0.85rem; box-shadow: var(--shadow-md); }
.btn-next.cta:hover { background: var(--orange-dark); border-color: var(--orange-dark); box-shadow: var(--shadow-lg); transform: none; }
.arrow { transition: transform 0.2s; }
.btn-next:hover .arrow { transform: translateX(3px); }
.btn-back {
  display: flex; align-items: center; gap: 0.5rem; background: transparent; border: 1px solid var(--border);
  color: var(--ink-faint); padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif;
  font-weight: 600; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.25s var(--transition); visibility: visible;
}
.btn-back:hover { border-color: var(--border-strong); color: var(--ink); transform: translateX(-2px); }
.btn-back.hidden { visibility: hidden; pointer-events: none; }
.btn-back-form {
  display: flex; align-items: center; gap: 0.5rem; background: transparent; border: 1px solid var(--border);
  color: var(--ink-faint); padding: 0.5rem 0.9rem; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif;
  font-weight: 600; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.25s var(--transition);
}
.btn-back-form:hover { border-color: var(--border-strong); color: var(--ink); transform: translateX(-2px); }

/* SCREEN 2 — FORM */
#s-form { background: var(--paper); overflow-y: auto; }
.form-topbar {
  display: flex; align-items: center; gap: 1rem; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
  background: var(--surface); position: sticky; top: 0; z-index: 10; flex-shrink: 0; box-shadow: var(--shadow-xs);
}
.form-topbar-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: -1px; color: var(--ink); }
.form-topbar-logo .x { color: var(--orange); }
.form-topbar-divider { width: 1px; height: 20px; background: var(--border); }
.form-topbar-label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
.form-content { padding: 2rem 1.5rem 3rem; max-width: 540px; margin: 0 auto; width: 100%; }
.form-eyebrow { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--orange-deep); font-weight: 700; margin-bottom: 0.75rem; }
.form-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 7vw, 3rem); line-height: 0.95; letter-spacing: -0.01em; margin-bottom: 0.5rem; text-transform: uppercase; color: var(--ink); }
.form-subtitle { font-size: 0.85rem; color: var(--ink-faint); margin-bottom: 2.5rem; font-weight: 400; }
.form-divider { height: 1px; background: var(--border); margin-bottom: 2rem; }
.field { margin-bottom: 1.25rem; }
.field-label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 0.5rem; }
.field-label .req { color: var(--orange-dark); font-size: 0.8rem; }
.field-input {
  width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0.9rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 400; color: var(--ink);
  transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; outline: none;
}
.field-input::placeholder { color: var(--ink-faint); }
.field-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-ring); }
.select-wrap { position: relative; }
.select-wrap::after {
  content: ''; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  border: 5px solid transparent; border-top-color: var(--ink-faint); margin-top: 3px; pointer-events: none;
}
.select-wrap select { background: var(--surface); cursor: pointer; }
.select-wrap select option { background: #FFFFFF; color: var(--ink); }
.consent-row {
  display: flex; gap: 0.85rem; align-items: flex-start; background: var(--surface-alt); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 2rem; cursor: pointer; transition: border-color 0.2s;
}
.consent-row:hover { border-color: rgba(255,90,31,0.35); }
.checkbox-custom {
  width: 20px; min-width: 20px; height: 20px; border: 1.5px solid var(--border-strong); border-radius: 4px; background: var(--surface);
  display: flex; align-items: center; justify-content: center; transition: all 0.2s; margin-top: 1px;
}
.checkbox-custom.checked { background: var(--orange); border-color: var(--orange); }
.checkbox-custom svg { display: none; }
.checkbox-custom.checked svg { display: block; }
.consent-text { font-size: 0.8rem; color: var(--ink-soft); line-height: 1.55; font-weight: 400; }

.sig-block { margin-bottom: 2rem; }
.sig-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
.sig-hint { font-size: 0.72rem; color: var(--ink-faint); font-weight: 400; margin-bottom: 0.6rem; }
.sig-canvas-wrap {
  position: relative; width: 100%; height: 170px; background: var(--surface-alt); border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius-sm); overflow: hidden; touch-action: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.sig-canvas-wrap.error { border-color: var(--orange); border-style: solid; box-shadow: 0 0 0 3px var(--orange-ring); }
#sig-pad { width: 100%; height: 100%; display: block; cursor: crosshair; background: transparent; }
.sig-placeholder {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; color: rgba(28,31,35,0.22); font-weight: 600; letter-spacing: 0.05em; pointer-events: none; text-transform: uppercase;
}
.sig-line { position: absolute; left: 5%; right: 5%; bottom: 28px; height: 1px; background: rgba(28,31,35,0.14); pointer-events: none; }
.sig-clear {
  background: var(--surface); border: 1px solid var(--border); color: var(--ink-faint); padding: 0.35rem 0.8rem;
  border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.68rem;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.sig-clear:hover { border-color: var(--orange); color: var(--orange-dark); }

.btn-submit {
  width: 100%; background: var(--orange); border: none; border-radius: var(--radius-sm); padding: 1.1rem;
  font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.15em; color: #FFFFFF;
  cursor: pointer; transition: all 0.25s var(--transition); box-shadow: var(--shadow-md); position: relative; overflow: hidden;
}
.btn-submit::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: left 0.5s;
}
.btn-submit:hover { background: var(--orange-dark); box-shadow: var(--shadow-lg); }
.btn-submit:hover::before { left: 100%; }
.btn-submit:active { transform: scale(0.99); }

/* SCREEN 3 — SUCCESS */
#s-success { background: var(--paper); align-items: center; justify-content: center; text-align: center; padding: 2rem; }
.success-ring {
  width: 100px; height: 100px; border-radius: 50%; background: var(--green-tint); border: 1px solid var(--green-ring);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem;
  animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both; position: relative;
}
.success-ring::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid rgba(21,138,67,0.14); animation: ringPulse 2s ease-in-out 0.5s infinite; }
@keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes ringPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.4; } }
.check-svg { width: 36px; height: 36px; }
.success-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -0.01em; line-height: 0.95; text-transform: uppercase; margin-bottom: 1rem; animation: fadeUp 0.6s 0.3s var(--transition) both; color: var(--ink); }
.success-sub { font-size: 0.95rem; color: var(--ink-soft); line-height: 1.65; max-width: 360px; font-weight: 400; animation: fadeUp 0.6s 0.45s var(--transition) both; margin: 0 auto; }
.success-card { margin-top: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; max-width: 340px; width: 100%; animation: fadeUp 0.6s 0.6s var(--transition) both; box-shadow: var(--shadow-sm); }
.success-card-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; color: var(--ink); }
.success-card-co { font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 1.1rem; }
.success-sig-img { width: 100%; height: 60px; object-fit: contain; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 1.1rem; }
.success-meta { display: flex; gap: 0.5rem; align-items: center; justify-content: center; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
.success-dot { width: 4px; height: 4px; background: var(--orange); border-radius: 50%; }
.success-time { margin-top: 0.5rem; font-size: 0.75rem; color: var(--ink-faint); animation: fadeUp 0.6s 0.75s var(--transition) both; }
.success-auto { margin-top: 1.1rem; font-size: 0.68rem; letter-spacing: 0.05em; color: var(--ink-faint); animation: fadeUp 0.6s 0.9s var(--transition) both; }

/* SCREEN 4 — ADMIN PIN */
#s-pin { background: var(--paper); align-items: center; justify-content: center; text-align: center; padding: 2rem; }
.pin-box { max-width: 320px; width: 100%; }
.pin-icon { font-size: 2.4rem; margin-bottom: 1rem; }
.pin-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: -0.01em; color: var(--ink); }
.pin-sub { font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 1.75rem; font-weight: 400; }
.pin-input {
  width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0.95rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 1.4rem; letter-spacing: 0.5em; text-align: center;
  color: var(--ink); outline: none; margin-bottom: 1rem;
}
.pin-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-ring); }
.pin-input.shake { animation: shake 0.4s; border-color: var(--orange); }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
.pin-actions { display: flex; gap: 0.6rem; }
.pin-btn-back {
  flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--ink-faint); padding: 0.85rem;
  border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.78rem; letter-spacing: 0.12em;
  text-transform: uppercase; cursor: pointer;
}
.pin-btn-go {
  flex: 1.4; background: var(--orange); border: none; color: #FFFFFF; padding: 0.85rem; border-radius: var(--radius-sm);
  font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem; letter-spacing: 0.12em; cursor: pointer; box-shadow: var(--shadow-sm);
}
.pin-btn-go:hover { background: var(--orange-dark); }

/* SCREEN 5 — HISTORY */
#s-history { background: var(--paper); }
.hist-topbar {
  display: flex; align-items: center; gap: 1rem; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
  background: var(--surface); position: sticky; top: 0; z-index: 10; flex-shrink: 0; flex-wrap: wrap; box-shadow: var(--shadow-xs);
}
.hist-title-wrap { flex: 1; min-width: 140px; }
.hist-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: -0.5px; line-height: 1; color: var(--ink); }
.hist-count { font-size: 0.68rem; color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.2rem; font-weight: 600; }
.hist-actions { display: flex; gap: 0.5rem; }
.hist-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--ink-faint); padding: 0.5rem 0.8rem;
  border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.68rem;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.hist-btn:hover { border-color: var(--orange); color: var(--orange-dark); }
.hist-list { padding: 1.25rem 1.5rem 3rem; max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 0.75rem; }
.hist-empty { text-align: center; color: var(--ink-faint); font-size: 0.85rem; padding: 3rem 1rem; font-weight: 400; }
.hist-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem 1.1rem; display: flex; gap: 1rem; align-items: center; transition: box-shadow 0.2s, border-color 0.2s; box-shadow: var(--shadow-xs); }
.hist-card:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }
.hist-card-main { flex: 1; min-width: 0; }
.hist-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.3rem; }
.hist-card-name { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.hist-card-time { font-size: 0.68rem; color: var(--ink-faint); white-space: nowrap; flex-shrink: 0; font-weight: 600; }
.hist-card-sub { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 0.4rem; }
.hist-card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.hist-tag { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 10px; background: var(--orange-tint); color: var(--orange-deep); border: 1px solid var(--orange-tint-2); }
.hist-tag.muted { background: var(--surface-alt); color: var(--ink-soft); border-color: var(--border); }
.hist-sig { width: 96px; height: 44px; object-fit: contain; background: #FFFFFF; border: 1px solid var(--border); border-radius: 6px; flex-shrink: 0; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 400px) { .lang-card { padding: 1.2rem 1.3rem; } .hist-sig{width:72px;} }
@media (min-height: 700px) { .slide { padding: 2.5rem 2rem; } }
</style>

<body>

<!-- SCREEN 0 — LANGUAGE -->
<div id="s-lang" class="screen active">
  <div class="grid-bg"></div>
  <div class="radial-glow"></div>
  <div class="lang-inner">
    <div class="gxo-wordmark"><span class="g">G</span><span class="x">X</span><span class="o">O</span></div>
    <p class="tagline">Logistics at full potential</p>
    <p class="lang-prompt">Choose your language</p>
    <div class="lang-grid">
      <button class="lang-card" onclick="boot('fr')"><span class="lang-flag">🇫🇷</span><span class="lang-label">Français</span></button>
      <button class="lang-card" onclick="boot('en')"><span class="lang-flag">🇬🇧</span><span class="lang-label">English</span></button>
      <button class="lang-card" onclick="boot('es')"><span class="lang-flag">🇪🇸</span><span class="lang-label">Español</span></button>
      <button class="lang-card" onclick="boot('ro')"><span class="lang-flag">🇷🇴</span><span class="lang-label">Română</span></button>
    </div>
  </div>
  <button class="admin-access" title="Historique / Administration" onclick="openPin()">🕓</button>
</div>

<!-- SCREEN 1 — SLIDES -->
<div id="s-slides" class="screen">
  <div class="topbar">
    <div class="topbar-logo">G<span class="x">X</span>O</div>
    <div class="topbar-info"><div class="topbar-site" id="tb-site"></div></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div class="slides-area" id="slides-area">
    <div class="slide" id="sl-0"><div class="slide-badge" id="b0"></div><div class="icon-ring">👋</div><h2 class="slide-heading" id="h0"></h2><p class="slide-body" id="p0"></p></div>
    <div class="slide" id="sl-1"><div class="slide-badge" id="b1"></div><div class="icon-ring">⚠️</div><h2 class="slide-heading" id="h1"></h2><div class="safety-wrap" id="safety-grid"></div><p class="safety-note" id="safety-note"></p></div>
    <div class="slide" id="sl-2"><div class="slide-badge" id="b2"></div><div class="icon-ring">🚨</div><h2 class="slide-heading" id="h2"></h2><div class="emergency-wrap" id="emergency-wrap"></div></div>
    <div class="slide" id="sl-3"><div class="slide-badge" id="b3"></div><div class="icon-ring">🚛</div><h2 class="slide-heading" id="h3"></h2><p class="slide-body" id="p3"></p></div>
    <div class="slide" id="sl-4"><div class="slide-badge" id="b4"></div><div class="icon-ring">✍️</div><h2 class="slide-heading" id="h4"></h2><p class="slide-body" id="p4"></p></div>
  </div>

  <div class="slides-nav">
    <button class="btn-back" id="btn-back" onclick="prevSlide()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M13 7H1M6 2L1 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="btn-back-label"></span>
    </button>
    <div class="dots" id="dots-wrap"></div>
    <button class="btn-next" id="btn-next" onclick="nextSlide()">
      <span id="btn-label"></span>
      <svg class="arrow" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<!-- SCREEN 2 — FORM -->
<div id="s-form" class="screen">
  <div class="form-topbar">
    <button class="btn-back-form" onclick="show('s-slides'); goSlide(N-1);">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M13 7H1M6 2L1 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="back-form-label"></span>
    </button>
    <div class="form-topbar-divider"></div>
    <div class="form-topbar-logo">G<span class="x">X</span>O</div>
    <div class="form-topbar-divider"></div>
    <div class="form-topbar-label" id="ft-label"></div>
  </div>

  <div class="form-content">
    <div class="form-eyebrow"><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#FF5A1F"/></svg><span id="fe-text"></span></div>
    <h3 class="form-title" id="form-title"></h3>
    <p class="form-subtitle" id="form-sub"></p>
    <div class="form-divider"></div>

    <div class="field">
      <div class="field-label"><span id="lbl-nom"></span><span class="req">*</span></div>
      <input class="field-input" type="text" id="f-nom" autocomplete="family-name">
    </div>
    <div class="field">
      <div class="field-label"><span id="lbl-prenom"></span><span class="req">*</span></div>
      <input class="field-input" type="text" id="f-prenom" autocomplete="given-name">
    </div>
    <div class="field">
      <div class="field-label"><span id="lbl-soc"></span><span class="req">*</span></div>
      <input class="field-input" type="text" id="f-soc" autocomplete="organization">
    </div>
    <div class="field">
      <div class="field-label"><span id="lbl-type"></span><span class="req">*</span></div>
      <div class="select-wrap">
        <select class="field-input" id="f-type">
          <option value="" id="opt-def"></option>
          <option value="dechargement" id="opt-liv"></option>
          <option value="chargement" id="opt-chg"></option>
        </select>
      </div>
    </div>

    <div class="consent-row" id="consent-row" onclick="toggleConsent()">
      <div class="checkbox-custom" id="checkbox">
        <svg class="check-svg" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <p class="consent-text" id="consent-text"></p>
    </div>

    <div class="sig-block">
      <div class="sig-head">
        <div class="field-label" style="margin-bottom:0;"><span id="lbl-sig"></span><span class="req">*</span></div>
        <button type="button" class="sig-clear" id="sig-clear-btn" onclick="clearSignature()"></button>
      </div>
      <p class="sig-hint" id="sig-hint"></p>
      <div class="sig-canvas-wrap" id="sig-wrap">
        <span class="sig-placeholder" id="sig-placeholder"></span>
        <div class="sig-line"></div>
        <canvas id="sig-pad"></canvas>
      </div>
    </div>

    <button class="btn-submit" id="btn-sub" onclick="submit()"></button>
  </div>
</div>

<!-- SCREEN 3 — SUCCESS -->
<div id="s-success" class="screen">
  <div class="success-ring"><svg class="check-svg" viewBox="0 0 36 36" fill="none"><path d="M8 18l7 7 13-13" stroke="#158A43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h3 class="success-title" id="s-title"></h3>
  <p class="success-sub" id="s-sub"></p>
  <div class="success-card">
    <div class="success-card-name" id="s-name"></div>
    <div class="success-card-co" id="s-co"></div>
    <img class="success-sig-img" id="s-sig-img" alt="signature">
    <div class="success-meta"><span id="s-type-txt"></span><div class="success-dot"></div><span>GXO Croissy-Beaubourg</span></div>
  </div>
  <div class="success-time" id="s-time"></div>
  <p class="success-auto" id="s-auto"></p>
</div>

<!-- SCREEN 4 — ADMIN PIN -->
<div id="s-pin" class="screen">
  <div class="pin-box">
    <div class="pin-icon">🔒</div>
    <div class="pin-title">Accès admin</div>
    <p class="pin-sub">Saisissez le code pour consulter l'historique des enregistrements.</p>
    <input class="pin-input" id="pin-input" type="password" inputmode="text" maxlength="5" autocomplete="off" placeholder="••••">
    <div class="pin-actions">
      <button class="pin-btn-back" onclick="show('s-lang')">Annuler</button>
      <button class="pin-btn-go" onclick="checkPin()">Valider</button>
    </div>
  </div>
</div>

<!-- SCREEN 5 — HISTORY -->
<div id="s-history" class="screen">
  <div class="hist-topbar">
    <button class="btn-back-form" onclick="show('s-lang')">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M13 7H1M6 2L1 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Retour</span>
    </button>
    <div class="hist-title-wrap">
      <div class="hist-title">Historique</div>
      <div class="hist-count" id="hist-count">0 enregistrement</div>
    </div>
    <div class="hist-actions">
      <button class="hist-btn" onclick="exportCsv()">Exporter CSV</button>
      <button class="hist-btn" onclick="clearAllHistory()">Vider</button>
    </div>
  </div>
  <div class="hist-list" id="hist-list"></div>
</div>

/* ─── SLIDE NAVIGATION ─── */
function goSlide(idx) {
  const prev = document.querySelector('.slide.active');
  if (prev) { prev.classList.remove('active'); prev.classList.add('exit'); setTimeout(() => prev.classList.remove('exit'), 600); }
  setTimeout(() => { document.getElementById('sl-'+idx).classList.add('active'); }, prev ? 80 : 0);

  document.getElementById('progress').style.width = ((idx+1)/N*100)+'%';
  for (let i=0;i<N;i++) { const d = document.getElementById('dot-'+i); if (d) d.classList.toggle('on', i===idx); }

  const backLabels = {fr:'Retour', en:'Back', es:'Atrás', ro:'Înapoi'};
  const bk = document.getElementById('btn-back');
  const bkl = document.getElementById('btn-back-label');
  if (bkl) bkl.textContent = backLabels[lang];
  if (bk) bk.classList.toggle('hidden', idx === 0);

  const btn = document.getElementById('btn-next');
  const lbl = document.getElementById('btn-label');
  const c = COPY[lang];
  if (idx === N-1) { lbl.textContent = c.register; btn.classList.add('cta'); }
  else { lbl.textContent = c.next; btn.classList.remove('cta'); }
}

function prevSlide() { if (slide > 0) goSlide(--slide); else { show('s-lang'); } }

/* ─── SIGNATURE PAD ─── */
let sigCtx = null, sigDrawing = false, sigHasInk = false, sigLastPt = null;

function initSignaturePad() {
  const canvas = document.getElementById('sig-pad');
  const wrap = document.getElementById('sig-wrap');
  const ratio = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = w * ratio;
  canvas.height = h * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigCtx.strokeStyle = '#1C1F23';
  sigHasInk = false;
  document.getElementById('sig-placeholder').style.display = 'flex';
  wrap.classList.remove('error');

  if (canvas.dataset.bound) return;
  canvas.dataset.bound = '1';

  const getPos = (e) => { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; };
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    sigDrawing = true;
    sigLastPt = getPos(e);
    document.getElementById('sig-placeholder').style.display = 'none';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!sigDrawing) return;
    e.preventDefault();
    const pt = getPos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(sigLastPt.x, sigLastPt.y);
    sigCtx.lineTo(pt.x, pt.y);
    sigCtx.stroke();
    sigLastPt = pt;
    sigHasInk = true;
  });
  const stop = () => { sigDrawing = false; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointerleave', stop);
  canvas.addEventListener('pointercancel', stop);
}

function clearSignature() {
  const canvas = document.getElementById('sig-pad');
  if (sigCtx) { const ratio = window.devicePixelRatio || 1; sigCtx.clearRect(0, 0, canvas.width/ratio, canvas.height/ratio); }
  sigHasInk = false;
  const ph = document.getElementById('sig-placeholder');
  if (ph) ph.style.display = 'flex';
  const wrap = document.getElementById('sig-wrap');
  if (wrap) wrap.classList.remove('error');
}

window.addEventListener('resize', () => {
  if (document.getElementById('s-form').classList.contains('active') || document.getElementById('s-slides').classList.contains('active')) {
    const hadInk = sigHasInk;
    initSignaturePad();
    if (!hadInk) return;
  }
});

/* ─── HISTORY / TRAÇABILITÉ (localStorage) ─── */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; }
}
function saveHistoryRecord(record) {
  try {
    const list = loadHistory();
    list.push(record);
    while (list.length > HISTORY_MAX) list.shift();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  } catch(e) { console.warn('Historique non sauvegardé (stockage local indisponible):', e); }
}

function openPin() {
  document.getElementById('pin-input').value = '';

  setTimeout(() => document.getElementById('pin-input').focus(), 200);
}
function checkPin() {
  const input = document.getElementById('pin-input');
  if (input.value === ADMIN_PIN) { renderHistoryScreen(); show('s-history'); }
  else {
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 400);
    input.value = '';
  }
}
document.addEventListener('keyup', (e) => {
  if (e.key === 'Enter' && document.getElementById('s-pin').classList.contains('active')) checkPin();
});

function renderHistoryScreen() {
  const list = loadHistory().slice().reverse();
  document.getElementById('hist-count').textContent = list.length + (list.length > 1 ? ' enregistrements' : ' enregistrement');
  const wrap = document.getElementById('hist-list');
  if (!list.length) {
    wrap.innerHTML = '<div class="hist-empty">Aucun enregistrement pour le moment.</div>';
    return;
  }
  wrap.innerHTML = list.map(r => {
    const fullName = r.fullName || [r.prenom, r.nom].filter(Boolean).join(' ') || r.nom || '';
    return `
    <div class="hist-card">
      <div class="hist-card-main">
        <div class="hist-card-top">
          <span class="hist-card-name">${escapeHtml(fullName)}</span>
          <span class="hist-card-time">${r.date} · ${r.heure}</span>
        </div>
        <div class="hist-card-sub">${escapeHtml(r.societe)}</div>
        <div class="hist-card-tags">
          <span class="hist-tag">${r.typeLabel}</span>
          <span class="hist-tag muted">${(r.langue||'').toUpperCase()}</span>
        </div>
      </div>
      <img class="hist-sig" src="${r.signature}" alt="signature">
    </div>
  `}).join('');
}
function escapeHtml(str) {
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function clearAllHistory() {
  if (confirm('Supprimer définitivement tout l\'historique des enregistrements ?')) {
    localStorage.removeItem(HISTORY_KEY);
    renderHistoryScreen();
  }
}
function exportCsv() {
  const list = loadHistory();
  if (!list.length) { alert('Aucun enregistrement à exporter.'); return; }
  const header = ['Nom','Prénom','Societe','Type','Langue','Date','Heure'];
  const rows = list.map(r => [r.nom, r.prenom, r.societe, r.typeLabel, r.langue, r.date, r.heure]
    .map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(';'));
  const csv = '\uFEFF' + header.join(';') + '\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gxo_historique_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ─── SUBMIT ─── */
async function submit() {
  const c = COPY[lang];
  const nom   = document.getElementById('f-nom').value.trim();
  const prenom = document.getElementById('f-prenom').value.trim();
  const fullName = [prenom, nom].filter(Boolean).join(' ');
  const soc   = document.getElementById('f-soc').value.trim();
  const type  = document.getElementById('f-type').value;

  if (!nom || !prenom || !soc || !type) { alert(c.errFields); return; }
  if (!consented) { alert(c.errConsent); return; }
  if (!sigHasInk) { document.getElementById('sig-wrap').classList.add('error'); alert(c.errSig); return; }

  const signatureDataUrl = document.getElementById('sig-pad').toDataURL('image/png');

  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
  const heureStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const typeLabel = type === 'dechargement' ? c.sLiv : c.sChg;

  const btnSub = document.getElementById('btn-sub');
  const originalText = btnSub.textContent;
  btnSub.textContent = '⏳ ...';
  btnSub.disabled = true;
  btnSub.style.opacity = '0.7';

  saveHistoryRecord({ nom, prenom, fullName, societe: soc, type, typeLabel, langue: lang, date: dateStr, heure: heureStr, signature: signatureDataUrl });

  if (POWER_AUTOMATE_URL !== 'COLLE_TON_URL_ICI') {
    try {
     await fetch(POWER_AUTOMATE_URL, {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({
    name: nom,
    "first name": prenom,
    fullName: fullName,
    Society: soc,
    type: typeLabel,
    date: dateStr,
    heure: heureStr,
    langue: lang
  })
});
      
    } catch(e) { console.warn('Erreur envoi Power Automate:', e); }
  }

  btnSub.textContent = originalText;
  btnSub.disabled = false;
  btnSub.style.opacity = '1';

  document.getElementById('s-title').innerHTML = c.sTitle.replace('\n','<br>');
  document.getElementById('s-sub').textContent = c.sSub;
  document.getElementById('s-name').textContent = fullName;
  document.getElementById('s-co').textContent = soc;
  document.getElementById('s-sig-img').src = signatureDataUrl;
  document.getElementById('s-type-txt').textContent = typeLabel;

  const localeMap = {fr:'fr-FR', en:'en-GB', es:'es-ES', ro:'ro-RO'};
  const dtStr = now.toLocaleDateString(localeMap[lang] || 'fr-FR', {weekday:'short',day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('s-time').textContent = c.sByLabel + ' ' + dtStr + ' — ' + heureStr;

  show('s-success');
  startAutoReturn(8);
}

/* ─── AUTO-RETURN TO HOME (kiosk mode) ─── */
let autoReturnTimer = null;
function startAutoReturn(seconds) {
  if (autoReturnTimer) clearInterval(autoReturnTimer);
  let remaining = seconds;
  const el = document.getElementById('s-auto');
  const render = () => { el.textContent = COPY[lang].autoReturn.replace('{sec}', remaining); };
  render();
  autoReturnTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0 || !document.getElementById('s-success').classList.contains('active')) {
      clearInterval(autoReturnTimer);
      autoReturnTimer = null;
      if (document.getElementById('s-success').classList.contains('active')) show('s-lang');
      return;
    }
    render();
  }, 1000);
}
